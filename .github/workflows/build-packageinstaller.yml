
name: Build PackageInstaller APK

'on':
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStableRelease \
            -PAPP_ID=com.android.packageinstaller

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          find app/build/outputs/apk -type f -name '*.apk'

          APK="$(find app/build/outputs/apk \
            -type f -name '*.apk' \
            ! -name '*androidTest*' | head -n 1)"

          test -n "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PackageInstaller-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 7
