name: Sync Upstream

on:
  schedule:
    # Daily at 21:17 UTC (~05:17 Beijing time); odd minute avoids runner congestion
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync from upstream main
        id: sync
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/wxxsfxyzm/InstallerX-Revived.git
          git fetch upstream main

          OLD_HEAD="$(git rev-parse HEAD)"
          UPSTREAM="$(git rev-parse upstream/main)"

          # Sync state file: records the upstream main SHA we last synced.
          LAST="$(git show "$OLD_HEAD":.github/upstream-synced-sha 2>/dev/null || echo none)"
          echo "last synced: $LAST"
          echo "upstream main: $UPSTREAM"

          if [ "$LAST" = "$UPSTREAM" ]; then
            echo "Upstream main unchanged since last sync - nothing to do"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Take upstream main wholesale, then restore our custom .github
          # (build workflow etc.) on top of it.
          git reset --hard upstream/main
          rm -rf .github
          git checkout "$OLD_HEAD" -- .github
          printf '%s\n' "$UPSTREAM" > .github/upstream-synced-sha
          git add -A

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only rebuild when actual source code changed; ignore .github
          # churn between upstream and us.
          if git diff --cached --quiet HEAD -- . ':(exclude).github'; then
            git commit --allow-empty -m "Sync upstream ${UPSTREAM:0:8} (no source changes)"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync upstream ${UPSTREAM:0:8}"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

          git push --force-with-lease origin main

      - name: Trigger build workflow
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # GITHUB_TOKEN pushes do not cascade-trigger other workflows,
          # so dispatch the build explicitly.
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-packageinstaller.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Build workflow dispatched"
